name = "open-dispatch"
main = "src/server/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "open-dispatch-db"
database_id = "local"

# Public routing service for the local preview. Set your own endpoint in production.
[vars]
OSRM_BASE_URL = "https://router.project-osrm.org"
